<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Standings" />
    <meta name="application-name" content="Standings" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="./standings-icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./standings-icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./standings-icon-512.png" />
    <title>Poker Ledger — Cumulative Standings</title>
    <style>
      :root {
        --bg-base: #0a0a0f;
        --bg-card: rgba(255, 255, 255, 0.035);
        --bg-card-hover: rgba(255, 255, 255, 0.06);
        --border: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(255, 255, 255, 0.14);
        --text: rgba(255, 255, 255, 0.96);
        --text-2: rgba(255, 255, 255, 0.62);
        --text-3: rgba(255, 255, 255, 0.4);
        --gain: #34d399;
        --gain-2: #10b981;
        --gain-soft: rgba(52, 211, 153, 0.12);
        --gain-glow: rgba(52, 211, 153, 0.4);
        --loss: #fb7185;
        --loss-2: #f43f5e;
        --loss-soft: rgba(251, 113, 133, 0.12);
        --loss-glow: rgba(251, 113, 133, 0.4);
        --gold: #fbbf24;
      }

      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

      html, body {
        margin: 0;
        padding: 0;
        background:
          radial-gradient(1200px 600px at 50% -200px, rgba(139, 92, 246, 0.10), transparent 60%),
          radial-gradient(900px 500px at 100% 110%, rgba(52, 211, 153, 0.05), transparent 60%),
          var(--bg-base);
        background-attachment: fixed;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
          "SF Pro Text", "Inter", system-ui, sans-serif;
        font-size: 15px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
        min-height: 100vh;
      }

      .page {
        max-width: 880px;
        margin: 0 auto;
        padding-top: max(24px, calc(env(safe-area-inset-top) + 18px));
        padding-bottom: max(48px, calc(env(safe-area-inset-bottom) + 32px));
        padding-left: max(20px, env(safe-area-inset-left));
        padding-right: max(20px, env(safe-area-inset-right));
      }

      .stack > * + * { margin-top: var(--gap, 20px); }
      .stack-28 { --gap: 28px; }
      .stack-20 { --gap: 20px; }
      .stack-14 { --gap: 14px; }
      .stack-10 { --gap: 10px; }
      .stack-6 { --gap: 6px; }
      .stack-4 { --gap: 4px; }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-3);
      }
      .eyebrow::before {
        content: "";
        display: inline-block;
        width: 22px;
        height: 1px;
        background: var(--text-3);
      }

      h1 {
        font-size: clamp(28px, 7.6vw, 40px);
        line-height: 1.05;
        letter-spacing: -0.025em;
        font-weight: 700;
        margin: 0;
        background: linear-gradient(180deg, #fff 0%, rgba(255, 255, 255, 0.74) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      h2 {
        font-size: 18px;
        line-height: 22px;
        letter-spacing: -0.01em;
        font-weight: 650;
        margin: 0;
        color: var(--text);
      }
      p { margin: 0; }
      .subtle { color: var(--text-2); }
      .tertiary { color: var(--text-3); }
      .small { font-size: 12px; line-height: 16px; }
      .gain-text { color: var(--gain); }
      .loss-text { color: var(--loss); }
      .tabular { font-variant-numeric: tabular-nums; }

      .meta-row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 6px 11px;
        border-radius: 999px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        font-size: 12px;
        font-weight: 500;
        color: var(--text-2);
        font-variant-numeric: tabular-nums;
      }
      .pill .dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--gain);
        box-shadow: 0 0 8px var(--gain-glow);
      }

      button.refresh {
        appearance: none;
        -webkit-appearance: none;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 8px 14px;
        border-radius: 999px;
        background: var(--bg-card);
        border: 1px solid var(--border-strong);
        color: var(--text);
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.18s ease, transform 0.18s ease, border-color 0.18s ease;
        touch-action: manipulation;
        min-height: 36px;
      }
      button.refresh:hover { background: var(--bg-card-hover); border-color: rgba(255, 255, 255, 0.22); }
      button.refresh:active { transform: scale(0.97); }
      button.refresh .icon { font-size: 14px; line-height: 1; }
      button.refresh.spinning .icon { animation: spin 0.7s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      .kpis {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .kpi {
        position: relative;
        border: 1px solid var(--border);
        background: var(--bg-card);
        border-radius: 16px;
        padding: 14px 16px;
        overflow: hidden;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      .kpi .kpi-label {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-3);
      }
      .kpi .kpi-value {
        margin-top: 8px;
        font-size: 26px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.015em;
        font-variant-numeric: tabular-nums;
      }
      .kpi.success {
        background: linear-gradient(180deg, rgba(52, 211, 153, 0.08), rgba(52, 211, 153, 0.015));
        border-color: rgba(52, 211, 153, 0.2);
      }
      .kpi.success .kpi-value { color: var(--gain); }
      .kpi.danger {
        background: linear-gradient(180deg, rgba(251, 113, 133, 0.08), rgba(251, 113, 133, 0.015));
        border-color: rgba(251, 113, 133, 0.2);
      }
      .kpi.danger .kpi-value { color: var(--loss); }

      section.card {
        border: 1px solid var(--border);
        background: var(--bg-card);
        border-radius: 20px;
        padding: 18px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }
      .section-sub {
        color: var(--text-2);
        font-size: 13px;
        line-height: 1.55;
      }
      .section-sub strong { font-weight: 650; }

      .chart-rows { display: flex; flex-direction: column; }
      .chart-row {
        display: grid;
        grid-template-columns: var(--col-name, 96px) 1fr var(--col-value, 60px);
        align-items: center;
        gap: 10px;
        padding: 5px 0;
      }
      .player-handle {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .avatar {
        flex-shrink: 0;
        width: 26px;
        height: 26px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .player-handle .pname {
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        letter-spacing: -0.01em;
      }
      .bar-track {
        position: relative;
        height: 22px;
        background: rgba(255, 255, 255, 0.025);
        border: 1px solid rgba(255, 255, 255, 0.04);
        border-radius: 6px;
        overflow: hidden;
      }
      .bar-track .axis {
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        width: 1px;
        background: rgba(255, 255, 255, 0.12);
      }
      .bar {
        position: absolute;
        top: 3px;
        bottom: 3px;
        border-radius: 4px;
        width: 0;
        transition: width 700ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .bar.gain {
        background: linear-gradient(90deg, var(--gain-2), var(--gain));
        box-shadow: 0 0 12px var(--gain-glow);
      }
      .bar.loss {
        background: linear-gradient(270deg, var(--loss-2), var(--loss));
        box-shadow: 0 0 12px var(--loss-glow);
      }
      .chart-value {
        font-size: 13px;
        font-weight: 700;
        text-align: right;
        letter-spacing: -0.01em;
        font-variant-numeric: tabular-nums;
      }
      .axis-labels {
        display: grid;
        grid-template-columns: var(--col-name, 96px) 1fr var(--col-value, 60px);
        gap: 10px;
        margin-top: 6px;
      }
      .axis-labels .scale {
        display: flex;
        justify-content: space-between;
        color: var(--text-3);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }

      .player-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .pcard {
        display: grid;
        grid-template-columns: 22px 36px 1fr auto;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.015);
      }
      .pcard.gain {
        background: linear-gradient(180deg, rgba(52, 211, 153, 0.06), rgba(52, 211, 153, 0.01));
        border-color: rgba(52, 211, 153, 0.18);
      }
      .pcard.loss {
        background: linear-gradient(180deg, rgba(251, 113, 133, 0.06), rgba(251, 113, 133, 0.01));
        border-color: rgba(251, 113, 133, 0.18);
      }
      .pcard .rank {
        font-size: 12px;
        font-weight: 700;
        color: var(--text-3);
        font-variant-numeric: tabular-nums;
        text-align: center;
        letter-spacing: -0.02em;
      }
      .pcard .avatar { width: 36px; height: 36px; font-size: 14px; }
      .pcard.leader .avatar {
        outline: 1.5px solid rgba(251, 191, 36, 0.65);
        outline-offset: 2px;
      }
      .pcard .pinfo { min-width: 0; }
      .pinfo-top {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
      }
      .pname-l {
        font-size: 15px;
        font-weight: 650;
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pcard .headline-stat {
        font-size: 15px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }
      .pinfo-bot {
        margin-top: 2px;
        font-size: 12px;
        color: var(--text-2);
        font-variant-numeric: tabular-nums;
      }
      .pinfo-bot .meta {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: block;
      }

      .error {
        border: 1px solid rgba(251, 113, 133, 0.25);
        background: rgba(251, 113, 133, 0.06);
        border-radius: 14px;
        padding: 14px 16px;
        color: var(--loss);
        font-size: 13px;
      }

      .tabs {
        display: inline-flex;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 4px;
        gap: 2px;
        margin-top: 4px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      .tab {
        appearance: none;
        -webkit-appearance: none;
        background: transparent;
        border: 0;
        color: var(--text-2);
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.005em;
        padding: 8px 14px;
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
        touch-action: manipulation;
        min-height: 36px;
      }
      .tab:hover { color: var(--text); }
      .tab.active {
        background: var(--bg-card-hover);
        color: var(--text);
        box-shadow: inset 0 0 0 1px var(--border-strong);
      }
      .tab:focus-visible {
        outline: 2px solid var(--gain);
        outline-offset: 2px;
      }

      .empty-state h2 { letter-spacing: -0.01em; }
      .empty-state .section-sub { max-width: 52ch; }

      .pinfo-breakdown {
        margin-top: 3px;
        font-size: 11.5px;
        line-height: 1.35;
        color: var(--text-3);
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.005em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pinfo-breakdown .mode-label { color: var(--text-2); font-weight: 600; }
      .pinfo-breakdown .sep { color: var(--text-3); }

      @media (max-width: 380px) {
        .chart-row, .axis-labels { --col-name: 80px; --col-value: 54px; gap: 8px; }
        .player-handle .pname { font-size: 12px; }
        .avatar { width: 22px; height: 22px; font-size: 10px; }
        .chart-value { font-size: 12px; }
        .pcard { grid-template-columns: 20px 32px 1fr auto; gap: 10px; padding: 11px 12px; }
        .pcard .avatar { width: 32px; height: 32px; font-size: 13px; }
        .pname-l, .pcard .headline-stat { font-size: 14px; }
        .pinfo-bot { font-size: 11px; }
        .kpi { padding: 12px 14px; }
        .kpi .kpi-value { font-size: 22px; }
        section.card { padding: 16px; border-radius: 18px; }
        .tab { padding: 7px 11px; font-size: 12px; min-height: 34px; }
      }

      @media (min-width: 640px) {
        .page { padding-left: 32px; padding-right: 32px; }
        section.card { padding: 24px; }
        .chart-row, .axis-labels { --col-name: 160px; --col-value: 76px; gap: 16px; }
        .avatar { width: 30px; height: 30px; font-size: 12px; }
        .player-handle .pname { font-size: 14px; }
        .chart-value { font-size: 14px; }
        .bar-track { height: 24px; }
        .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
        .kpi { padding: 16px 18px; }
        .kpi .kpi-value { font-size: 28px; }
        .pcard { grid-template-columns: 28px 40px 1fr auto; padding: 14px 16px; }
        .pcard .avatar { width: 40px; height: 40px; font-size: 15px; }
        .pname-l, .pcard .headline-stat { font-size: 16px; }
      }
    </style>
  </head>
  <body>
    <main class="page stack stack-20" id="root"></main>

    <script>
      const MIN_GAMES = 5;
      // Mode CSVs (Tournament/Cash) start fresh and accumulate one session at
      // a time, so a 5-game floor would hide every player for weeks. While
      // those tabs are still building up, show every player who has played
      // at least once.
      const MIN_GAMES_MODE = 1;

      const TABS = [
        {
          id: "overall",
          label: "Overall",
          url: "./PokerSummary.csv",
          minGames: MIN_GAMES,
          eyebrow: "All sessions, rolling totals",
        },
        {
          id: "tournament",
          label: "Tournament",
          url: "./PokerTournamentSummary.csv",
          minGames: MIN_GAMES_MODE,
          eyebrow: "Tournament sessions only",
        },
        {
          id: "cash",
          label: "Cash Game",
          url: "./PokerCashSummary.csv",
          minGames: MIN_GAMES_MODE,
          eyebrow: "Cash-game sessions only",
        },
      ];
      const DEFAULT_TAB = "overall";
      const TAB_STORAGE_KEY = "standings.activeTab";

      function el(tag, attrs = {}, ...children) {
        const node = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (k === "class") node.className = v;
          else if (k === "style") node.setAttribute("style", v);
          else node.setAttribute(k, v);
        }
        for (const c of children.flat()) {
          if (c == null || c === false) continue;
          node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
        }
        return node;
      }

      function fmtSigned(n) {
        if (n === 0) return "$0";
        return (n > 0 ? "+$" : "-$") + Math.abs(n).toLocaleString();
      }
      function fmtAvg(n) {
        if (n === 0) return "$0.00";
        return (n > 0 ? "+$" : "-$") + Math.abs(n).toFixed(2);
      }
      function fmtMoney(n) {
        return "$" + Math.abs(n).toLocaleString();
      }

      // Curated palette of 12 visually distinct hues. We deliberately skip
      // the 130-175° range (would clash with the emerald gain bars) and the
      // 335-10° range (would clash with the rose loss bars) so an avatar
      // never reads as a P/L signal. Ordered to maximize contrast between
      // neighboring palette slots.
      const HUE_PALETTE = [15, 220, 45, 280, 60, 200, 180, 305, 30, 255, 100, 240];

      function assignHues(players) {
        // Stable alphabetical assignment so a player's color doesn't change
        // when the display order changes (e.g. re-sorted by net P/L).
        const byName = [...players].sort((a, b) => a.name.localeCompare(b.name));
        byName.forEach((p, i) => {
          p.hue = HUE_PALETTE[i % HUE_PALETTE.length];
        });
      }

      function avatar(player) {
        const hue = player.hue ?? 220;
        const hue2 = (hue + 32) % 360;
        const initial = (player.name.trim()[0] || "?").toUpperCase();
        return el(
          "div",
          {
            class: "avatar",
            style:
              `background: linear-gradient(135deg, hsl(${hue}, 66%, 38%), hsl(${hue2}, 58%, 22%));` +
              `color: hsl(${hue}, 90%, 90%);` +
              `box-shadow: inset 0 0 0 1px hsl(${hue}, 62%, 30%);`,
          },
          initial,
        );
      }

      function parseCsv(text, minGames = MIN_GAMES) {
        const lines = text.replace(/\r\n?/g, "\n").split("\n").filter((l) => l.trim());
        const rows = lines.slice(1).map((line) => line.split(",").map((s) => s.trim()));
        const players = [];
        for (const cols of rows) {
          if (cols.length < 8) continue;
          const games = parseInt(cols[0], 10);
          const name = cols[1];
          if (!name || name === "TOTAL") continue;
          if (!Number.isFinite(games) || games < minGames) continue;
          players.push({
            name,
            games,
            buyIn: parseFloat(cols[2]) || 0,
            cashOut: parseFloat(cols[4]) || 0,
            net: parseFloat(cols[6]) || 0,
            netAvg: parseFloat(cols[7]) || 0,
          });
        }
        assignHues(players);
        return players;
      }

      async function loadCsv(url) {
        // Cache-busting via query string AND `cache: no-store`.
        // Defeats iOS standalone-webapp's aggressive WebKit cache so
        // the standings always reflect the latest CSV in the repo.
        const fullUrl = `${url}?t=${Date.now()}`;
        const res = await fetch(fullUrl, { cache: "no-store" });
        if (!res.ok) throw new Error(`Failed to load ${url} (HTTP ${res.status})`);
        const text = await res.text();
        const lastModified = res.headers.get("last-modified");
        return { text, lastModified };
      }

      async function loadAllData() {
        // Fetch every CSV once, but produce two views per tab:
        //   - byTab: filtered by the tab's minGames threshold; drives the
        //     headline standings on each tab.
        //   - byMode: every player regardless of session count; backs the
        //     per-mode breakdown sub-line so even single-session players
        //     can show their other-mode performance.
        const fetched = await Promise.all(
          TABS.map(async (tab) => {
            const { text, lastModified } = await loadCsv(tab.url);
            return { tab, text, lastModified };
          }),
        );

        const byTab = {};
        const byMode = {};
        for (const { tab, text, lastModified } of fetched) {
          byTab[tab.id] = { players: parseCsv(text, tab.minGames), lastModified };
          if (tab.id === "tournament" || tab.id === "cash") {
            byMode[tab.id] = parseCsv(text, 0);
          }
        }

        applyUnifiedHues(byTab, byMode);
        const breakdownIndex = buildBreakdownIndex(byMode);
        return { byTab, breakdownIndex };
      }

      // assignHues() picks colors based on alphabetical position WITHIN the
      // set it's given, so a player would otherwise get a different hue in
      // each tab. Compute one mapping across the union of every player we
      // know about (both the threshold-filtered tab views AND the unfiltered
      // mode indexes) and patch every player so their avatar color is stable
      // across tabs.
      function applyUnifiedHues(byTab, byMode) {
        const seen = new Set();
        const synthetic = [];
        const consider = (p) => {
          if (!seen.has(p.name)) {
            seen.add(p.name);
            synthetic.push({ name: p.name });
          }
        };
        for (const tab of TABS) for (const p of byTab[tab.id].players) consider(p);
        for (const mode of Object.keys(byMode)) for (const p of byMode[mode]) consider(p);

        assignHues(synthetic);
        const hueByName = new Map(synthetic.map((s) => [s.name, s.hue]));
        for (const tab of TABS) {
          for (const p of byTab[tab.id].players) {
            p.hue = hueByName.get(p.name) ?? p.hue;
          }
        }
      }

      function buildBreakdownIndex(byMode) {
        const idx = new Map();
        for (const mode of ["tournament", "cash"]) {
          for (const p of byMode[mode] || []) {
            const key = p.name.toLowerCase();
            if (!idx.has(key)) idx.set(key, {});
            idx.get(key)[mode] = p;
          }
        }
        return idx;
      }

      function fmtRelative(date) {
        if (!date) return null;
        const diff = (Date.now() - date.getTime()) / 1000;
        if (diff < 60) return "just now";
        if (diff < 3600) return Math.round(diff / 60) + " min ago";
        if (diff < 86400) return Math.round(diff / 3600) + " h ago";
        const days = Math.round(diff / 86400);
        return days + " day" + (days === 1 ? "" : "s") + " ago";
      }

      function buildTabStrip() {
        const strip = el("div", { class: "tabs", role: "tablist" });
        for (const tab of TABS) {
          const isActive = state.activeTab === tab.id;
          const btn = el(
            "button",
            {
              type: "button",
              class: "tab" + (isActive ? " active" : ""),
              role: "tab",
              "aria-selected": isActive ? "true" : "false",
              "data-tab": tab.id,
            },
            tab.label,
          );
          btn.addEventListener("click", () => setActiveTab(tab.id));
          strip.appendChild(btn);
        }
        return strip;
      }

      function buildBlurb(ctx) {
        const { players, totals, tab } = ctx;
        if (!players.length || !totals) {
          return `${tab.eyebrow}. No qualifying sessions yet — keep playing and they'll show up here.`;
        }
        if (tab.id === "overall") {
          return `${players.length} regulars (${MIN_GAMES}+ sessions) across ${totals.totalGames} player-games. Sorted by net P/L; bars scale to the largest swing per side (${totals.maxAbsPlayer.name}, ${fmtMoney(totals.maxAbs)}).`;
        }
        const sessionWord = tab.id === "tournament" ? "tournament" : "cash";
        return `${players.length} player${players.length === 1 ? "" : "s"} across ${totals.totalGames} ${sessionWord} player-game${totals.totalGames === 1 ? "" : "s"}. Sorted by net P/L; bars scale to the largest swing per side (${totals.maxAbsPlayer.name}, ${fmtMoney(totals.maxAbs)}).`;
      }

      function buildHeader(ctx, onRefresh) {
        const { lastModifiedDate } = ctx;
        const updatedLabel = lastModifiedDate
          ? `Updated ${fmtRelative(lastModifiedDate)}`
          : "Live data";

        const refreshBtn = el(
          "button",
          {
            type: "button",
            class: "refresh",
            "aria-label": "Refresh standings",
          },
          el("span", { class: "icon", "aria-hidden": "true" }, "↻"),
          el("span", {}, "Refresh"),
        );
        refreshBtn.addEventListener("click", () => {
          refreshBtn.classList.add("spinning");
          onRefresh();
        });

        const updated = el(
          "span",
          { class: "pill" },
          el("span", { class: "dot", "aria-hidden": "true" }),
          updatedLabel,
        );

        return el(
          "header",
          { class: "stack stack-10" },
          el("div", { class: "eyebrow" }, "Poker Ledger"),
          el("h1", {}, "Cumulative Standings"),
          el(
            "p",
            { class: "subtle", style: "max-width: 62ch" },
            buildBlurb(ctx),
          ),
          buildTabStrip(),
          el("div", { class: "meta-row" }, updated, refreshBtn),
        );
      }

      function buildEmptyState(tab) {
        const message =
          tab.id === "tournament"
            ? "No tournament sessions logged yet. Standings will appear here once the first tournament is recorded."
            : tab.id === "cash"
            ? "No cash-game sessions logged yet. Standings will appear here once the first cash session is recorded."
            : "No qualifying players yet.";
        return el(
          "section",
          { class: "card empty-state stack stack-10" },
          el("h2", {}, `${tab.label} — Starting fresh`),
          el("p", { class: "section-sub" }, message),
        );
      }

      function buildKpis(ctx) {
        const { totals } = ctx;
        const make = (label, value, tone) =>
          el(
            "div",
            { class: "kpi" + (tone ? " " + tone : "") },
            el("div", { class: "kpi-label" }, label),
            el("div", { class: "kpi-value" }, value),
          );
        return el(
          "section",
          { class: "kpis", "aria-label": "Summary statistics" },
          make("Pool Turnover", "$" + totals.totalBuyIn.toLocaleString()),
          make("Player-Games", String(totals.totalGames)),
          make("In the Green", String(totals.winners), "success"),
          make("In the Red", String(totals.losers), "danger"),
        );
      }

      function buildChart(ctx) {
        const { sorted, totals } = ctx;
        const { maxNet, minNet } = totals;

        const rows = sorted.map((p) => {
          const scale = p.net >= 0 ? maxNet : Math.abs(minNet);
          const ratio = scale > 0 ? Math.abs(p.net) / scale : 0;
          const widthPct = ratio * 50;
          const isPositive = p.net > 0;
          const isZero = p.net === 0;

          const track = el("div", { class: "bar-track" }, el("div", { class: "axis" }));
          if (!isZero) {
            const left = isPositive ? 50 : 50 - widthPct;
            const bar = el("div", {
              class: "bar " + (isPositive ? "gain" : "loss"),
              style: `left:${left}%; width:0%`,
            });
            track.appendChild(bar);
            requestAnimationFrame(() =>
              requestAnimationFrame(() => {
                bar.style.width = widthPct + "%";
              }),
            );
          }
          const valueTone = isZero ? "tertiary" : isPositive ? "gain-text" : "loss-text";
          return el(
            "div",
            { class: "chart-row" },
            el(
              "div",
              { class: "player-handle" },
              avatar(p),
              el("div", { class: "pname" }, p.name),
            ),
            track,
            el("div", { class: "chart-value " + valueTone }, fmtSigned(p.net)),
          );
        });

        return el(
          "section",
          { class: "card stack stack-14" },
          el(
            "div",
            { class: "section-head" },
            el("h2", {}, "Net P/L by Player"),
            el("span", { class: "tertiary small" }, "Centered on $0"),
          ),
          el("div", { class: "chart-rows" }, ...rows),
          el(
            "div",
            { class: "axis-labels" },
            el("div"),
            el(
              "div",
              { class: "scale" },
              el("span", {}, `-${fmtMoney(Math.abs(minNet))}`),
              el("span", {}, "$0"),
              el("span", {}, `+${fmtMoney(maxNet)}`),
            ),
            el("div"),
          ),
        );
      }

      function buildBreakdownLine(player, activeTabId, breakdownIndex) {
        if (!breakdownIndex) return null;
        const entry = breakdownIndex.get(player.name.toLowerCase()) || {};
        const showT = activeTabId !== "tournament" && entry.tournament;
        const showC = activeTabId !== "cash" && entry.cash;
        if (!showT && !showC) return null;

        const children = [];
        const pushPart = (label, p) => {
          if (children.length) children.push(el("span", { class: "sep" }, "  ·  "));
          const tone = p.net > 0 ? "gain-text" : p.net < 0 ? "loss-text" : "tertiary";
          children.push(
            el("span", { class: "mode-label" }, `${label}: `),
            el("span", { class: tone }, fmtSigned(p.net)),
            el("span", {}, ` · ${p.games}g`),
          );
        };
        if (showT) pushPart("T", entry.tournament);
        if (showC) pushPart("C", entry.cash);
        return el("div", { class: "pinfo-breakdown" }, ...children);
      }

      function buildPlayerList(ctx) {
        const { sortedByAvg, totals, tab, breakdownIndex } = ctx;

        const items = sortedByAvg.map((p, i) => {
          const rowClass = p.netAvg > 0 ? "gain" : p.netAvg < 0 ? "loss" : "";
          const tone = p.netAvg > 0 ? "gain-text" : p.netAvg < 0 ? "loss-text" : "tertiary";
          const isLeader = i === 0 && p.netAvg > 0;
          const breakdown = buildBreakdownLine(p, tab.id, breakdownIndex);
          const pinfoChildren = [
            el(
              "div",
              { class: "pinfo-top" },
              el("span", { class: "pname-l" }, p.name),
              el(
                "span",
                { class: "headline-stat " + tone },
                fmtAvg(p.netAvg) + "/g",
              ),
            ),
            el(
              "div",
              { class: "pinfo-bot" },
              el(
                "span",
                { class: "meta" },
                `${p.games} GP · ${fmtMoney(p.buyIn)} → ${fmtMoney(p.cashOut)}`,
              ),
            ),
          ];
          if (breakdown) pinfoChildren.push(breakdown);

          return el(
            "li",
            { class: "pcard " + rowClass + (isLeader ? " leader" : "") },
            el("div", { class: "rank" }, "#" + (i + 1)),
            avatar(p),
            el("div", { class: "pinfo" }, ...pinfoChildren),
          );
        });

        return el(
          "section",
          { class: "card stack stack-14" },
          el(
            "div",
            { class: "section-head" },
            el("h2", {}, "Per-Session Performance"),
          ),
          el(
            "p",
            { class: "section-sub" },
            "Net per game reveals true skill independent of attendance — ",
            el("strong", { class: "gain-text" }, totals.bestAvg.name),
            ` leads at ${fmtAvg(totals.bestAvg.netAvg)}/g (${totals.bestAvg.games} sessions), while `,
            el("strong", { class: "loss-text" }, totals.worstAvg.name),
            ` is the deepest hole at ${fmtAvg(totals.worstAvg.netAvg)}/g.`,
          ),
          el("ol", { class: "player-list" }, ...items),
        );
      }

      function computeTotals(players) {
        const totalGames = players.reduce((s, p) => s + p.games, 0);
        const totalBuyIn = players.reduce((s, p) => s + p.buyIn, 0);
        const winners = players.filter((p) => p.net > 0).length;
        const losers = players.filter((p) => p.net < 0).length;
        const maxAbs = Math.max(...players.map((p) => Math.abs(p.net)));
        const maxAbsPlayer = players.find((p) => Math.abs(p.net) === maxAbs);
        const maxNet = Math.max(...players.map((p) => p.net));
        const minNet = Math.min(...players.map((p) => p.net));
        const byNetAvg = [...players].sort((a, b) => b.netAvg - a.netAvg);
        return {
          totalGames,
          totalBuyIn,
          winners,
          losers,
          maxAbs,
          maxAbsPlayer,
          maxNet,
          minNet,
          bestAvg: byNetAvg[0],
          worstAvg: byNetAvg[byNetAvg.length - 1],
        };
      }

      function renderShell(message, isError) {
        const root = document.getElementById("root");
        root.innerHTML = "";
        root.appendChild(
          el(
            "header",
            { class: "stack stack-10" },
            el("div", { class: "eyebrow" }, "Poker Ledger"),
            el("h1", {}, "Cumulative Standings"),
            el(
              "p",
              { class: isError ? "error" : "subtle small" },
              message,
            ),
          ),
        );
      }

      function getInitialTab() {
        const hash = (location.hash || "").replace(/^#/, "");
        if (TABS.some((t) => t.id === hash)) return hash;
        try {
          const stored = localStorage.getItem(TAB_STORAGE_KEY);
          if (stored && TABS.some((t) => t.id === stored)) return stored;
        } catch {}
        return DEFAULT_TAB;
      }

      const state = { activeTab: getInitialTab(), data: null, breakdownIndex: null };

      function setActiveTab(id) {
        if (state.activeTab === id) return;
        state.activeTab = id;
        try { localStorage.setItem(TAB_STORAGE_KEY, id); } catch {}
        if (location.hash !== `#${id}`) {
          history.replaceState(null, "", `#${id}`);
        }
        renderActive();
      }

      async function loadAndRender() {
        if (!state.data) renderShell("Loading latest standings…", false);
        let result;
        try {
          result = await loadAllData();
        } catch (e) {
          renderShell(
            "Couldn’t load the latest standings. Pull down to refresh or check your connection. (" +
              e.message +
              ")",
            true,
          );
          return;
        }
        state.data = result.byTab;
        state.breakdownIndex = result.breakdownIndex;
        renderActive();
      }

      function renderActive() {
        const root = document.getElementById("root");
        root.innerHTML = "";
        if (!state.data) return;

        const tab = TABS.find((t) => t.id === state.activeTab) || TABS[0];
        const entry = state.data[tab.id];
        const players = entry.players;
        const lastModifiedDate = entry.lastModified ? new Date(entry.lastModified) : null;

        if (!players.length) {
          const ctx = { players, totals: null, lastModifiedDate, tab };
          root.appendChild(buildHeader(ctx, loadAndRender));
          root.appendChild(buildEmptyState(tab));
          return;
        }

        const totals = computeTotals(players);
        const sorted = [...players].sort((a, b) => b.net - a.net);
        const sortedByAvg = [...players].sort((a, b) => b.netAvg - a.netAvg);
        const ctx = {
          players,
          sorted,
          sortedByAvg,
          totals,
          lastModifiedDate,
          tab,
          breakdownIndex: state.breakdownIndex,
        };

        root.appendChild(buildHeader(ctx, loadAndRender));
        root.appendChild(buildKpis(ctx));
        root.appendChild(buildChart(ctx));
        root.appendChild(buildPlayerList(ctx));
      }

      loadAndRender();

      // Re-fetch whenever the standalone webapp regains focus (e.g. user
      // taps the home-screen icon after backgrounding it). This keeps the
      // standings fresh without needing a manual reload.
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") loadAndRender();
      });
      window.addEventListener("pageshow", (e) => {
        if (e.persisted) loadAndRender();
      });
      window.addEventListener("hashchange", () => {
        const next = (location.hash || "").replace(/^#/, "");
        if (TABS.some((t) => t.id === next) && next !== state.activeTab) {
          state.activeTab = next;
          try { localStorage.setItem(TAB_STORAGE_KEY, next); } catch {}
          renderActive();
        }
      });
    </script>
  </body>
</html>
