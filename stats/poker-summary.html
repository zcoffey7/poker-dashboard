<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#181818" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Poker Ledger — Cumulative Standings</title>
    <style>
      :root {
        --bg-editor: #181818;
        --bg-chrome: #141414;
        --bg-elevated: #1d1d1d;
        --text-primary: #e4e4e4eb;
        --text-secondary: #e4e4e48d;
        --text-tertiary: #e4e4e45e;
        --stroke-primary: #e4e4e433;
        --stroke-secondary: #e4e4e41f;
        --stroke-tertiary: #e4e4e414;
        --fill-tertiary: #e4e4e411;
        --fill-quaternary: #e4e4e40a;
        --gain: #1f8a65e8;
        --gain-soft: #1f8a651f;
        --loss: #cf2d56e8;
        --loss-soft: #cf2d561f;
        --name-col: 88px;
        --value-col: 64px;
        --row-gap: 14px;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg-editor);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 14px;
        line-height: 20px;
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
      }
      .page {
        max-width: 960px;
        margin: 0 auto;
        padding: 40px 32px 64px;
        padding-left: max(32px, env(safe-area-inset-left));
        padding-right: max(32px, env(safe-area-inset-right));
        padding-bottom: max(64px, env(safe-area-inset-bottom));
      }
      h1 {
        font-size: 24px;
        line-height: 30px;
        font-weight: 590;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 18px;
        line-height: 24px;
        font-weight: 590;
        margin: 0;
      }
      .subtle { color: var(--text-secondary); }
      .tertiary { color: var(--text-tertiary); }
      .small { font-size: 12px; line-height: 16px; }
      .stack > * + * { margin-top: var(--gap, 16px); }
      .stack-24 { --gap: 24px; }
      .stack-12 { --gap: 12px; }
      .stack-6 { --gap: 6px; }
      .stack-4 { --gap: 4px; }
      hr.divider {
        border: 0;
        border-top: 1px solid var(--stroke-tertiary);
        margin: 0;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
      }
      .stat {
        border: 1px solid var(--stroke-tertiary);
        background: var(--bg-elevated);
        border-radius: 8px;
        padding: 14px 16px;
      }
      .stat .v {
        font-size: 22px;
        line-height: 26px;
        font-weight: 590;
      }
      .stat .l {
        margin-top: 2px;
        font-size: 12px;
        color: var(--text-secondary);
      }
      .stat.success .v { color: var(--gain); }
      .stat.danger .v { color: var(--loss); }

      .chart .row {
        display: grid;
        grid-template-columns: var(--name-col) 1fr var(--value-col);
        gap: var(--row-gap);
        align-items: center;
      }
      .chart .row .name {
        text-align: right;
        font-weight: 500;
      }
      .chart .row .value {
        font-weight: 600;
        font-size: 12px;
      }
      .chart .row.header .name,
      .chart .row.header .value {
        color: var(--text-tertiary);
        font-weight: 400;
        font-size: 12px;
      }
      .bar-track {
        position: relative;
        height: 26px;
        background: var(--fill-quaternary);
        border-radius: 3px;
      }
      .bar-track .axis {
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        width: 1px;
        background: var(--stroke-secondary);
      }
      .bar {
        position: absolute;
        top: 3px;
        bottom: 3px;
        border-radius: 2px;
      }
      .bar.gain { background: var(--gain); }
      .bar.loss { background: var(--loss); }
      .gain-text { color: var(--gain); }
      .loss-text { color: var(--loss); }
      .axis-row {
        display: grid;
        grid-template-columns: var(--name-col) 1fr var(--value-col);
        gap: var(--row-gap);
        margin-top: 4px;
      }
      .axis-labels {
        display: flex;
        justify-content: space-between;
        color: var(--text-tertiary);
        font-size: 12px;
      }
      .header-axis {
        position: relative;
        height: 16px;
      }
      .header-axis .label {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        color: var(--text-tertiary);
        font-size: 12px;
      }

      .table-wrap {
        border: 1px solid var(--stroke-tertiary);
        border-radius: 8px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        font-variant-numeric: tabular-nums;
      }
      thead th {
        text-align: right;
        font-weight: 500;
        font-size: 12px;
        color: var(--text-secondary);
        background: var(--bg-chrome);
        padding: 8px 12px;
        border-bottom: 1px solid var(--stroke-tertiary);
        white-space: nowrap;
        position: sticky;
        top: 0;
      }
      thead th:nth-child(2) { text-align: left; }
      tbody td {
        padding: 8px 12px;
        text-align: right;
        border-bottom: 1px solid var(--stroke-tertiary);
        font-size: 13px;
        white-space: nowrap;
      }
      tbody tr:last-child td { border-bottom: 0; }
      tbody td:nth-child(2) { text-align: left; font-weight: 500; }
      tbody tr.gain td { background: var(--gain-soft); }
      tbody tr.loss td { background: var(--loss-soft); }
      tbody tr:nth-child(even):not(.gain):not(.loss) td {
        background: var(--fill-quaternary);
      }

      @media (max-width: 720px) {
        :root {
          --name-col: 72px;
          --value-col: 58px;
          --row-gap: 10px;
        }
        body { font-size: 13px; line-height: 18px; }
        .page { padding: 24px 16px 48px; }
        h1 { font-size: 20px; line-height: 26px; }
        h2 { font-size: 16px; line-height: 22px; }
        .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
        .stat { padding: 12px 14px; }
        .stat .v { font-size: 18px; line-height: 22px; }
        .stat .l { font-size: 11px; }
        .bar-track { height: 22px; }
        .chart .row .name { font-size: 13px; }
        .chart .row .value { font-size: 11px; }
        .axis-labels { font-size: 11px; }
        thead th, tbody td { padding: 7px 9px; font-size: 12px; }
      }

      @media (max-width: 380px) {
        :root {
          --name-col: 60px;
          --value-col: 54px;
          --row-gap: 8px;
        }
        .page { padding: 20px 12px 40px; }
      }
    </style>
  </head>
  <body>
    <main class="page stack stack-24" id="root"></main>

    <script>
      const MIN_GAMES = 5;
      const PLAYERS = [
        { name: "Souse", games: 22, buyIn: 890, cashOut: 1155, net: 265, netAvg: 12.05 },
        { name: "Toby", games: 15, buyIn: 590, cashOut: 810, net: 220, netAvg: 14.67 },
        { name: "Mercer", games: 22, buyIn: 955, cashOut: 1160, net: 205, netAvg: 9.32 },
        { name: "Xander", games: 13, buyIn: 545, cashOut: 725, net: 180, netAvg: 13.85 },
        { name: "Coffey", games: 24, buyIn: 1590, cashOut: 1725, net: 135, netAvg: 5.63 },
        { name: "Martell", games: 14, buyIn: 475, cashOut: 455, net: -20, netAvg: -1.43 },
        { name: "Brods", games: 6, buyIn: 305, cashOut: 80, net: -225, netAvg: -37.50 },
        { name: "Vallis", games: 17, buyIn: 815, cashOut: 465, net: -350, netAvg: -20.59 },
        { name: "Ham", games: 21, buyIn: 815, cashOut: 460, net: -355, netAvg: -16.90 },
        { name: "Randell", games: 13, buyIn: 620, cashOut: 255, net: -365, netAvg: -28.08 },
      ];

      const totalGames = PLAYERS.reduce((s, p) => s + p.games, 0);
      const totalBuyIn = PLAYERS.reduce((s, p) => s + p.buyIn, 0);
      const winners = PLAYERS.filter((p) => p.net > 0).length;
      const losers = PLAYERS.filter((p) => p.net < 0).length;
      const sorted = [...PLAYERS].sort((a, b) => b.net - a.net);
      const maxAbs = Math.max(...PLAYERS.map((p) => Math.abs(p.net)));
      const maxAbsPlayer = PLAYERS.find((p) => Math.abs(p.net) === maxAbs);
      const maxNet = Math.max(...PLAYERS.map((p) => p.net));
      const minNet = Math.min(...PLAYERS.map((p) => p.net));
      const byNetAvg = [...PLAYERS].sort((a, b) => b.netAvg - a.netAvg);
      const bestAvg = byNetAvg[0];
      const worstAvg = byNetAvg[byNetAvg.length - 1];

      function fmtSigned(n) {
        if (n === 0) return "$0";
        return (n > 0 ? "+$" : "-$") + Math.abs(n);
      }
      function fmtAvg(n) {
        if (n === 0) return "$0";
        return (n > 0 ? "+$" : "-$") + Math.abs(n).toFixed(2);
      }
      function el(tag, attrs = {}, ...children) {
        const node = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (k === "class") node.className = v;
          else if (k === "style") node.setAttribute("style", v);
          else node.setAttribute(k, v);
        }
        for (const c of children.flat()) {
          if (c == null) continue;
          node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
        }
        return node;
      }

      function header() {
        return el(
          "section",
          { class: "stack stack-4" },
          el("h1", {}, "Poker Ledger — Cumulative Standings"),
          el(
            "p",
            { class: "subtle", style: "margin:0" },
            `${PLAYERS.length} regulars (${MIN_GAMES}+ sessions) across ${totalGames} player-games. Sorted by net P/L; bars scale to the largest absolute swing (${maxAbsPlayer.name}, $${maxAbs}).`
          )
        );
      }

      function stats() {
        const make = (v, l, tone) =>
          el(
            "div",
            { class: "stat" + (tone ? " " + tone : "") },
            el("div", { class: "v" }, v),
            el("div", { class: "l" }, l)
          );
        return el(
          "section",
          { class: "stats" },
          make("$" + totalBuyIn.toLocaleString(), "Pool Turnover"),
          make(String(totalGames), "Player-Games"),
          make(String(winners), "In the Green", "success"),
          make(String(losers), "In the Red", "danger")
        );
      }

      function chart() {
        const headerRow = el(
          "div",
          { class: "row header" },
          el("div", { class: "name" }, "Player"),
          el(
            "div",
            { class: "header-axis" },
            el("div", { class: "axis" }),
            el("div", { class: "label" }, "$0")
          ),
          el("div", { class: "value", style: "text-align:left" }, "Net")
        );

        const rows = sorted.map((p) => {
          const scale = p.net >= 0 ? maxNet : Math.abs(minNet);
          const ratio = Math.abs(p.net) / scale;
          const widthPct = ratio * 50;
          const isPositive = p.net > 0;
          const isZero = p.net === 0;
          const track = el("div", { class: "bar-track" }, el("div", { class: "axis" }));
          if (!isZero) {
            const left = isPositive ? 50 : 50 - widthPct;
            track.appendChild(
              el("div", {
                class: "bar " + (isPositive ? "gain" : "loss"),
                style: `left:${left}%; width:${widthPct}%`,
              })
            );
          }
          return el(
            "div",
            { class: "row" },
            el("div", { class: "name" }, p.name),
            track,
            el(
              "div",
              {
                class:
                  "value " + (isZero ? "tertiary" : isPositive ? "gain-text" : "loss-text"),
              },
              fmtSigned(p.net)
            )
          );
        });

        const axisRow = el(
          "div",
          { class: "axis-row" },
          el("div"),
          el(
            "div",
            { class: "axis-labels" },
            el("span", {}, `-$${Math.abs(minNet)}`),
            el("span", {}, `+$${maxNet}`)
          ),
          el("div")
        );

        return el(
          "section",
          { class: "stack stack-12" },
          el("h2", {}, "Net P/L by Player"),
          el(
            "div",
            { class: "chart stack stack-4" },
            headerRow,
            el("div", { class: "stack stack-4" }, ...rows),
            axisRow
          )
        );
      }

      function table() {
        const head = el(
          "thead",
          {},
          el(
            "tr",
            {},
            ...["#", "Player", "GP", "Buy-In", "Cash Out", "Net", "Net / Game"].map(
              (h) => el("th", {}, h)
            )
          )
        );
        const body = el(
          "tbody",
          {},
          ...sorted.map((p, i) =>
            el(
              "tr",
              { class: p.net > 0 ? "gain" : p.net < 0 ? "loss" : "" },
              el("td", {}, String(i + 1)),
              el("td", {}, p.name),
              el("td", {}, String(p.games)),
              el("td", {}, "$" + p.buyIn),
              el("td", {}, "$" + p.cashOut),
              el("td", {}, fmtSigned(p.net)),
              el("td", {}, fmtAvg(p.netAvg))
            )
          )
        );
        return el(
          "section",
          { class: "stack stack-12" },
          el("h2", {}, "Per-Session Performance"),
          el(
            "p",
            { class: "subtle small", style: "margin:0" },
            `Net per game reveals true skill independent of attendance — ${bestAvg.name} leads at ${fmtAvg(bestAvg.netAvg)}/game (${bestAvg.games} sessions), while ${worstAvg.name} is the deepest hole at ${fmtAvg(worstAvg.netAvg)}/game.`
          ),
          el("div", { class: "table-wrap" }, el("table", {}, head, body))
        );
      }

      const root = document.getElementById("root");
      root.appendChild(header());
      root.appendChild(stats());
      root.appendChild(el("hr", { class: "divider" }));
      root.appendChild(chart());
      root.appendChild(el("hr", { class: "divider" }));
      root.appendChild(table());
    </script>
  </body>
</html>
