<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#181818" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Standings" />
    <meta name="application-name" content="Standings" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="./standings-icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./standings-icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./standings-icon-512.png" />
    <title>Poker Ledger — Cumulative Standings</title>
    <style>
      :root {
        --bg-editor: #181818;
        --bg-chrome: #141414;
        --bg-elevated: #1d1d1d;
        --text-primary: #e4e4e4eb;
        --text-secondary: #e4e4e48d;
        --text-tertiary: #e4e4e45e;
        --stroke-primary: #e4e4e433;
        --stroke-secondary: #e4e4e41f;
        --stroke-tertiary: #e4e4e414;
        --fill-tertiary: #e4e4e411;
        --fill-quaternary: #e4e4e40a;
        --gain: #1f8a65e8;
        --gain-soft: #1f8a651f;
        --loss: #cf2d56e8;
        --loss-soft: #cf2d561f;
        --name-col: 88px;
        --value-col: 64px;
        --row-gap: 14px;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg-editor);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 14px;
        line-height: 20px;
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
      }
      .page {
        max-width: 960px;
        margin: 0 auto;
        padding: 40px 32px 64px;
        padding-left: max(32px, env(safe-area-inset-left));
        padding-right: max(32px, env(safe-area-inset-right));
        padding-bottom: max(64px, env(safe-area-inset-bottom));
      }
      h1 {
        font-size: 24px;
        line-height: 30px;
        font-weight: 590;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 18px;
        line-height: 24px;
        font-weight: 590;
        margin: 0;
      }
      .subtle { color: var(--text-secondary); }
      .tertiary { color: var(--text-tertiary); }
      .small { font-size: 12px; line-height: 16px; }
      .stack > * + * { margin-top: var(--gap, 16px); }
      .stack-24 { --gap: 24px; }
      .stack-12 { --gap: 12px; }
      .stack-6 { --gap: 6px; }
      .stack-4 { --gap: 4px; }
      hr.divider {
        border: 0;
        border-top: 1px solid var(--stroke-tertiary);
        margin: 0;
      }
      .title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .refresh-btn {
        appearance: none;
        -webkit-appearance: none;
        background: var(--bg-elevated);
        color: var(--text-primary);
        border: 1px solid var(--stroke-tertiary);
        border-radius: 999px;
        padding: 6px 12px;
        font: inherit;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
        touch-action: manipulation;
      }
      .refresh-btn:hover { border-color: var(--stroke-primary); }
      .refresh-btn:active { background: var(--fill-tertiary); }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
      }
      .stat {
        border: 1px solid var(--stroke-tertiary);
        background: var(--bg-elevated);
        border-radius: 8px;
        padding: 14px 16px;
      }
      .stat .v {
        font-size: 22px;
        line-height: 26px;
        font-weight: 590;
      }
      .stat .l {
        margin-top: 2px;
        font-size: 12px;
        color: var(--text-secondary);
      }
      .stat.success .v { color: var(--gain); }
      .stat.danger .v { color: var(--loss); }

      .chart .row {
        display: grid;
        grid-template-columns: var(--name-col) 1fr var(--value-col);
        gap: var(--row-gap);
        align-items: center;
      }
      .chart .row .name {
        text-align: right;
        font-weight: 500;
      }
      .chart .row .value {
        font-weight: 600;
        font-size: 12px;
      }
      .chart .row.header .name,
      .chart .row.header .value {
        color: var(--text-tertiary);
        font-weight: 400;
        font-size: 12px;
      }
      .bar-track {
        position: relative;
        height: 26px;
        background: var(--fill-quaternary);
        border-radius: 3px;
      }
      .bar-track .axis {
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        width: 1px;
        background: var(--stroke-secondary);
      }
      .bar {
        position: absolute;
        top: 3px;
        bottom: 3px;
        border-radius: 2px;
      }
      .bar.gain { background: var(--gain); }
      .bar.loss { background: var(--loss); }
      .gain-text { color: var(--gain); }
      .loss-text { color: var(--loss); }
      .axis-row {
        display: grid;
        grid-template-columns: var(--name-col) 1fr var(--value-col);
        gap: var(--row-gap);
        margin-top: 4px;
      }
      .axis-labels {
        display: flex;
        justify-content: space-between;
        color: var(--text-tertiary);
        font-size: 12px;
      }
      .header-axis {
        position: relative;
        height: 16px;
      }
      .header-axis .label {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        color: var(--text-tertiary);
        font-size: 12px;
      }

      .table-wrap {
        border: 1px solid var(--stroke-tertiary);
        border-radius: 8px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        font-variant-numeric: tabular-nums;
      }
      thead th {
        text-align: right;
        font-weight: 500;
        font-size: 12px;
        color: var(--text-secondary);
        background: var(--bg-chrome);
        padding: 8px 12px;
        border-bottom: 1px solid var(--stroke-tertiary);
        white-space: nowrap;
        position: sticky;
        top: 0;
      }
      thead th:nth-child(2) { text-align: left; }
      tbody td {
        padding: 8px 12px;
        text-align: right;
        border-bottom: 1px solid var(--stroke-tertiary);
        font-size: 13px;
        white-space: nowrap;
      }
      tbody tr:last-child td { border-bottom: 0; }
      tbody td:nth-child(2) { text-align: left; font-weight: 500; }
      tbody tr.gain td { background: var(--gain-soft); }
      tbody tr.loss td { background: var(--loss-soft); }
      tbody tr:nth-child(even):not(.gain):not(.loss) td {
        background: var(--fill-quaternary);
      }

      @media (max-width: 720px) {
        :root {
          --name-col: 72px;
          --value-col: 58px;
          --row-gap: 10px;
        }
        body { font-size: 13px; line-height: 18px; }
        .page { padding: 24px 16px 48px; }
        h1 { font-size: 20px; line-height: 26px; }
        h2 { font-size: 16px; line-height: 22px; }
        .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
        .stat { padding: 12px 14px; }
        .stat .v { font-size: 18px; line-height: 22px; }
        .stat .l { font-size: 11px; }
        .bar-track { height: 22px; }
        .chart .row .name { font-size: 13px; }
        .chart .row .value { font-size: 11px; }
        .axis-labels { font-size: 11px; }
        thead th, tbody td { padding: 7px 9px; font-size: 12px; }
      }

      @media (max-width: 380px) {
        :root {
          --name-col: 60px;
          --value-col: 54px;
          --row-gap: 8px;
        }
        .page { padding: 20px 12px 40px; }
      }
    </style>
  </head>
  <body>
    <main class="page stack stack-24" id="root"></main>

    <script>
      const MIN_GAMES = 5;
      const DATA_URL = "./PokerSummary.csv";

      function el(tag, attrs = {}, ...children) {
        const node = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (k === "class") node.className = v;
          else if (k === "style") node.setAttribute("style", v);
          else node.setAttribute(k, v);
        }
        for (const c of children.flat()) {
          if (c == null) continue;
          node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
        }
        return node;
      }

      function fmtSigned(n) {
        if (n === 0) return "$0";
        return (n > 0 ? "+$" : "-$") + Math.abs(n);
      }
      function fmtAvg(n) {
        if (n === 0) return "$0";
        return (n > 0 ? "+$" : "-$") + Math.abs(n).toFixed(2);
      }

      function parseCsv(text) {
        const lines = text.replace(/\r\n?/g, "\n").split("\n").filter((l) => l.trim());
        const rows = lines.slice(1).map((line) => line.split(",").map((s) => s.trim()));
        const players = [];
        for (const cols of rows) {
          if (cols.length < 8) continue;
          const games = parseInt(cols[0], 10);
          const name = cols[1];
          if (!name || name === "TOTAL") continue;
          if (!Number.isFinite(games) || games < MIN_GAMES) continue;
          players.push({
            name,
            games,
            buyIn: parseFloat(cols[2]) || 0,
            cashOut: parseFloat(cols[4]) || 0,
            net: parseFloat(cols[6]) || 0,
            netAvg: parseFloat(cols[7]) || 0,
          });
        }
        return players;
      }

      async function loadData() {
        // Cache-busting via query string AND `cache: no-store`.
        // Defeats iOS standalone-webapp's aggressive WebKit cache so
        // the standings always reflect the latest CSV in the repo.
        const url = `${DATA_URL}?t=${Date.now()}`;
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) throw new Error(`Failed to load data (HTTP ${res.status})`);
        const text = await res.text();
        const lastModified = res.headers.get("last-modified");
        return { players: parseCsv(text), lastModified };
      }

      function fmtRelative(date) {
        if (!date) return null;
        const diff = (Date.now() - date.getTime()) / 1000;
        if (diff < 60) return "just now";
        if (diff < 3600) return Math.round(diff / 60) + " min ago";
        if (diff < 86400) return Math.round(diff / 3600) + " h ago";
        const days = Math.round(diff / 86400);
        return days + " day" + (days === 1 ? "" : "s") + " ago";
      }

      function header(ctx, onRefresh) {
        const { players, totals, lastModifiedDate } = ctx;
        const updatedLabel = lastModifiedDate
          ? `Updated ${fmtRelative(lastModifiedDate)}`
          : "Live data";
        const refreshBtn = el(
          "button",
          {
            type: "button",
            class: "refresh-btn",
            "aria-label": "Refresh standings",
          },
          "↻ Refresh"
        );
        refreshBtn.addEventListener("click", onRefresh);
        return el(
          "section",
          { class: "stack stack-4" },
          el(
            "div",
            { class: "title-row" },
            el("h1", {}, "Poker Ledger — Cumulative Standings"),
            refreshBtn
          ),
          el(
            "p",
            { class: "subtle", style: "margin:0" },
            `${players.length} regulars (${MIN_GAMES}+ sessions) across ${totals.totalGames} player-games. Sorted by net P/L; bars scale to the largest absolute swing (${totals.maxAbsPlayer.name}, $${totals.maxAbs}).`
          ),
          el("p", { class: "tertiary small", style: "margin:0" }, updatedLabel)
        );
      }

      function stats(ctx) {
        const { totals } = ctx;
        const make = (v, l, tone) =>
          el(
            "div",
            { class: "stat" + (tone ? " " + tone : "") },
            el("div", { class: "v" }, v),
            el("div", { class: "l" }, l)
          );
        return el(
          "section",
          { class: "stats" },
          make("$" + totals.totalBuyIn.toLocaleString(), "Pool Turnover"),
          make(String(totals.totalGames), "Player-Games"),
          make(String(totals.winners), "In the Green", "success"),
          make(String(totals.losers), "In the Red", "danger")
        );
      }

      function chart(ctx) {
        const { sorted, totals } = ctx;
        const { maxNet, minNet } = totals;
        const headerRow = el(
          "div",
          { class: "row header" },
          el("div", { class: "name" }, "Player"),
          el(
            "div",
            { class: "header-axis" },
            el("div", { class: "axis" }),
            el("div", { class: "label" }, "$0")
          ),
          el("div", { class: "value", style: "text-align:left" }, "Net")
        );

        const rows = sorted.map((p) => {
          const scale = p.net >= 0 ? maxNet : Math.abs(minNet);
          const ratio = scale > 0 ? Math.abs(p.net) / scale : 0;
          const widthPct = ratio * 50;
          const isPositive = p.net > 0;
          const isZero = p.net === 0;
          const track = el("div", { class: "bar-track" }, el("div", { class: "axis" }));
          if (!isZero) {
            const left = isPositive ? 50 : 50 - widthPct;
            track.appendChild(
              el("div", {
                class: "bar " + (isPositive ? "gain" : "loss"),
                style: `left:${left}%; width:${widthPct}%`,
              })
            );
          }
          const valueTone = isZero
            ? "tertiary"
            : isPositive
              ? "gain-text"
              : "loss-text";
          return el(
            "div",
            { class: "row" },
            el("div", { class: "name" }, p.name),
            track,
            el("div", { class: "value " + valueTone }, fmtSigned(p.net))
          );
        });

        const axisRow = el(
          "div",
          { class: "axis-row" },
          el("div"),
          el(
            "div",
            { class: "axis-labels" },
            el("span", {}, `-$${Math.abs(minNet)}`),
            el("span", {}, `+$${maxNet}`)
          ),
          el("div")
        );

        return el(
          "section",
          { class: "stack stack-12" },
          el("h2", {}, "Net P/L by Player"),
          el(
            "div",
            { class: "chart stack stack-4" },
            headerRow,
            el("div", { class: "stack stack-4" }, ...rows),
            axisRow
          )
        );
      }

      function table(ctx) {
        const { sorted, totals } = ctx;
        const head = el(
          "thead",
          {},
          el(
            "tr",
            {},
            ...["#", "Player", "GP", "Buy-In", "Cash Out", "Net", "Net / Game"].map(
              (h) => el("th", {}, h)
            )
          )
        );
        const body = el(
          "tbody",
          {},
          ...sorted.map((p, i) => {
            const rowClass = p.net > 0 ? "gain" : p.net < 0 ? "loss" : "";
            return el(
              "tr",
              { class: rowClass },
              el("td", {}, String(i + 1)),
              el("td", {}, p.name),
              el("td", {}, String(p.games)),
              el("td", {}, "$" + p.buyIn),
              el("td", {}, "$" + p.cashOut),
              el("td", {}, fmtSigned(p.net)),
              el("td", {}, fmtAvg(p.netAvg))
            );
          })
        );
        return el(
          "section",
          { class: "stack stack-12" },
          el("h2", {}, "Per-Session Performance"),
          el(
            "p",
            { class: "subtle small", style: "margin:0" },
            `Net per game reveals true skill independent of attendance — ${totals.bestAvg.name} leads at ${fmtAvg(totals.bestAvg.netAvg)}/game (${totals.bestAvg.games} sessions), while ${totals.worstAvg.name} is the deepest hole at ${fmtAvg(totals.worstAvg.netAvg)}/game.`
          ),
          el("div", { class: "table-wrap" }, el("table", {}, head, body))
        );
      }

      function computeTotals(players) {
        const totalGames = players.reduce((s, p) => s + p.games, 0);
        const totalBuyIn = players.reduce((s, p) => s + p.buyIn, 0);
        const winners = players.filter((p) => p.net > 0).length;
        const losers = players.filter((p) => p.net < 0).length;
        const maxAbs = Math.max(...players.map((p) => Math.abs(p.net)));
        const maxAbsPlayer = players.find((p) => Math.abs(p.net) === maxAbs);
        const maxNet = Math.max(...players.map((p) => p.net));
        const minNet = Math.min(...players.map((p) => p.net));
        const byNetAvg = [...players].sort((a, b) => b.netAvg - a.netAvg);
        return {
          totalGames,
          totalBuyIn,
          winners,
          losers,
          maxAbs,
          maxAbsPlayer,
          maxNet,
          minNet,
          bestAvg: byNetAvg[0],
          worstAvg: byNetAvg[byNetAvg.length - 1],
        };
      }

      function renderShell(message, isError) {
        const root = document.getElementById("root");
        root.innerHTML = "";
        root.appendChild(
          el(
            "section",
            { class: "stack stack-6" },
            el("h1", {}, "Poker Ledger — Cumulative Standings"),
            el(
              "p",
              { class: (isError ? "loss-text" : "subtle") + " small", style: "margin:0" },
              message
            )
          )
        );
      }

      async function render() {
        renderShell("Loading latest standings…", false);
        let data;
        try {
          data = await loadData();
        } catch (e) {
          renderShell(
            "Couldn’t load the latest standings. Pull down to refresh or check your connection. (" +
              e.message +
              ")",
            true
          );
          return;
        }

        const players = data.players;
        if (!players.length) {
          renderShell(
            "No players meet the minimum-session threshold yet.",
            false
          );
          return;
        }

        const totals = computeTotals(players);
        const sorted = [...players].sort((a, b) => b.net - a.net);
        const lastModifiedDate = data.lastModified ? new Date(data.lastModified) : null;
        const ctx = { players, sorted, totals, lastModifiedDate };

        const root = document.getElementById("root");
        root.innerHTML = "";
        root.appendChild(header(ctx, render));
        root.appendChild(stats(ctx));
        root.appendChild(el("hr", { class: "divider" }));
        root.appendChild(chart(ctx));
        root.appendChild(el("hr", { class: "divider" }));
        root.appendChild(table(ctx));
      }

      render();

      // Re-fetch whenever the standalone webapp regains focus (e.g. user
      // taps the home-screen icon after backgrounding it). This keeps the
      // standings fresh without needing a manual reload.
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") render();
      });
      window.addEventListener("pageshow", (e) => {
        if (e.persisted) render();
      });
    </script>
  </body>
</html>
