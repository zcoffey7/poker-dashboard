name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Standings integration test
        run: npm run test:integration

      - name: Build static export
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Bundle standings page
        run: |
          mkdir -p out/standings
          cp stats/poker-summary.html out/standings/index.html
          cp stats/PokerSummary.csv out/standings/PokerSummary.csv
          cp stats/PokerTournamentSummary.csv out/standings/PokerTournamentSummary.csv
          cp stats/PokerCashSummary.csv out/standings/PokerCashSummary.csv
          cp stats/manifest.webmanifest out/standings/manifest.webmanifest
          cp stats/standings-icon-180.png out/standings/standings-icon-180.png
          cp stats/standings-icon-192.png out/standings/standings-icon-192.png
          cp stats/standings-icon-512.png out/standings/standings-icon-512.png

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
