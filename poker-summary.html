<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Poker Ledger — Cumulative Standings</title>
    <style>
      :root {
        --bg-editor: #181818;
        --bg-chrome: #141414;
        --bg-elevated: #1d1d1d;
        --text-primary: #e4e4e4eb;
        --text-secondary: #e4e4e48d;
        --text-tertiary: #e4e4e45e;
        --stroke-primary: #e4e4e433;
        --stroke-secondary: #e4e4e41f;
        --stroke-tertiary: #e4e4e414;
        --fill-tertiary: #e4e4e411;
        --fill-quaternary: #e4e4e40a;
        --gain: #1f8a65e8;
        --gain-soft: #1f8a651f;
        --loss: #cf2d56e8;
        --loss-soft: #cf2d561f;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg-editor);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 14px;
        line-height: 20px;
        -webkit-font-smoothing: antialiased;
      }
      .page {
        max-width: 960px;
        margin: 0 auto;
        padding: 40px 32px 64px;
      }
      h1 {
        font-size: 24px;
        line-height: 30px;
        font-weight: 590;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 18px;
        line-height: 24px;
        font-weight: 590;
        margin: 0;
      }
      .subtle { color: var(--text-secondary); }
      .tertiary { color: var(--text-tertiary); }
      .small { font-size: 12px; line-height: 16px; }
      .stack > * + * { margin-top: var(--gap, 16px); }
      .stack-24 { --gap: 24px; }
      .stack-12 { --gap: 12px; }
      .stack-6 { --gap: 6px; }
      .stack-4 { --gap: 4px; }
      hr.divider {
        border: 0;
        border-top: 1px solid var(--stroke-tertiary);
        margin: 0;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
      }
      .stat {
        border: 1px solid var(--stroke-tertiary);
        background: var(--bg-elevated);
        border-radius: 8px;
        padding: 14px 16px;
      }
      .stat .v {
        font-size: 22px;
        line-height: 26px;
        font-weight: 590;
      }
      .stat .l {
        margin-top: 2px;
        font-size: 12px;
        color: var(--text-secondary);
      }
      .stat.success .v { color: var(--gain); }
      .stat.danger .v { color: var(--loss); }

      .chart .row {
        display: grid;
        grid-template-columns: 88px 1fr 64px;
        gap: 14px;
        align-items: center;
      }
      .chart .row .name {
        text-align: right;
        font-weight: 500;
      }
      .chart .row .value {
        font-weight: 600;
        font-size: 12px;
      }
      .chart .row.header .name,
      .chart .row.header .value {
        color: var(--text-tertiary);
        font-weight: 400;
        font-size: 12px;
      }
      .bar-track {
        position: relative;
        height: 26px;
        background: var(--fill-quaternary);
        border-radius: 3px;
      }
      .bar-track .axis {
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        width: 1px;
        background: var(--stroke-secondary);
      }
      .bar {
        position: absolute;
        top: 3px;
        bottom: 3px;
        border-radius: 2px;
      }
      .bar.gain { background: var(--gain); }
      .bar.loss { background: var(--loss); }
      .gain-text { color: var(--gain); }
      .loss-text { color: var(--loss); }
      .axis-row {
        display: grid;
        grid-template-columns: 88px 1fr 64px;
        gap: 14px;
        margin-top: 4px;
      }
      .axis-labels {
        display: flex;
        justify-content: space-between;
        color: var(--text-tertiary);
        font-size: 12px;
      }
      .header-axis {
        position: relative;
        height: 16px;
      }
      .header-axis .label {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        color: var(--text-tertiary);
        font-size: 12px;
      }

      table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        border: 1px solid var(--stroke-tertiary);
        border-radius: 8px;
        overflow: hidden;
        font-variant-numeric: tabular-nums;
      }
      thead th {
        text-align: right;
        font-weight: 500;
        font-size: 12px;
        color: var(--text-secondary);
        background: var(--bg-chrome);
        padding: 8px 12px;
        border-bottom: 1px solid var(--stroke-tertiary);
      }
      thead th:nth-child(2) { text-align: left; }
      tbody td {
        padding: 8px 12px;
        text-align: right;
        border-bottom: 1px solid var(--stroke-tertiary);
        font-size: 13px;
      }
      tbody tr:last-child td { border-bottom: 0; }
      tbody td:nth-child(2) { text-align: left; font-weight: 500; }
      tbody tr.gain td { background: var(--gain-soft); }
      tbody tr.loss td { background: var(--loss-soft); }
      tbody tr:nth-child(even):not(.gain):not(.loss) td {
        background: var(--fill-quaternary);
      }
    </style>
  </head>
  <body>
    <main class="page stack stack-24" id="root"></main>

    <script>
      const PLAYERS = [
        { name: "Ethan", games: 11, buyIn: 490, cashOut: 740, net: 250, netAvg: 22.73 },
        { name: "Swain", games: 3, buyIn: 110, cashOut: 345, net: 235, netAvg: 78.33 },
        { name: "Coffey", games: 13, buyIn: 650, cashOut: 800, net: 150, netAvg: 11.54 },
        { name: "Mercer", games: 13, buyIn: 555, cashOut: 705, net: 150, netAvg: 11.54 },
        { name: "Toby", games: 7, buyIn: 270, cashOut: 265, net: -5, netAvg: -0.71 },
        { name: "Martell", games: 8, buyIn: 240, cashOut: 230, net: -10, netAvg: -1.25 },
        { name: "Vallis", games: 9, buyIn: 345, cashOut: 275, net: -70, netAvg: -7.78 },
        { name: "Xander", games: 8, buyIn: 325, cashOut: 240, net: -85, netAvg: -10.63 },
        { name: "Marshall", games: 3, buyIn: 170, cashOut: 80, net: -90, netAvg: -30 },
        { name: "Brods", games: 3, buyIn: 155, cashOut: 30, net: -125, netAvg: -41.67 },
        { name: "Ham", games: 11, buyIn: 375, cashOut: 200, net: -175, netAvg: -15.91 },
        { name: "Randell", games: 7, buyIn: 380, cashOut: 65, net: -315, netAvg: -45 },
      ];

      const totalGames = PLAYERS.reduce((s, p) => s + p.games, 0);
      const totalBuyIn = PLAYERS.reduce((s, p) => s + p.buyIn, 0);
      const winners = PLAYERS.filter((p) => p.net > 0).length;
      const losers = PLAYERS.filter((p) => p.net < 0).length;
      const sorted = [...PLAYERS].sort((a, b) => b.net - a.net);
      const maxAbs = Math.max(...PLAYERS.map((p) => Math.abs(p.net)));

      function fmtSigned(n) {
        if (n === 0) return "$0";
        return (n > 0 ? "+$" : "-$") + Math.abs(n);
      }
      function fmtAvg(n) {
        if (n === 0) return "$0";
        return (n > 0 ? "+$" : "-$") + Math.abs(n).toFixed(2);
      }
      function el(tag, attrs = {}, ...children) {
        const node = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (k === "class") node.className = v;
          else if (k === "style") node.setAttribute("style", v);
          else node.setAttribute(k, v);
        }
        for (const c of children.flat()) {
          if (c == null) continue;
          node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
        }
        return node;
      }

      function header() {
        return el(
          "section",
          { class: "stack stack-4" },
          el("h1", {}, "Poker Ledger — Cumulative Standings"),
          el(
            "p",
            { class: "subtle", style: "margin:0" },
            `${PLAYERS.length} regulars (3+ sessions) across ${totalGames} player-games. Sorted by net P/L; bars scale to the largest absolute swing (Randell, $${maxAbs}).`
          )
        );
      }

      function stats() {
        const make = (v, l, tone) =>
          el(
            "div",
            { class: "stat" + (tone ? " " + tone : "") },
            el("div", { class: "v" }, v),
            el("div", { class: "l" }, l)
          );
        return el(
          "section",
          { class: "stats" },
          make("$" + totalBuyIn.toLocaleString(), "Pool Turnover"),
          make(String(totalGames), "Player-Games"),
          make(String(winners), "In the Green", "success"),
          make(String(losers), "In the Red", "danger")
        );
      }

      function chart() {
        const headerRow = el(
          "div",
          { class: "row header" },
          el("div", { class: "name" }, "Player"),
          el(
            "div",
            { class: "header-axis" },
            el("div", { class: "axis" }),
            el("div", { class: "label" }, "$0")
          ),
          el("div", { class: "value", style: "text-align:left" }, "Net")
        );

        const rows = sorted.map((p) => {
          const ratio = Math.abs(p.net) / maxAbs;
          const widthPct = ratio * 50;
          const isPositive = p.net > 0;
          const isZero = p.net === 0;
          const track = el("div", { class: "bar-track" }, el("div", { class: "axis" }));
          if (!isZero) {
            const left = isPositive ? 50 : 50 - widthPct;
            track.appendChild(
              el("div", {
                class: "bar " + (isPositive ? "gain" : "loss"),
                style: `left:${left}%; width:${widthPct}%`,
              })
            );
          }
          return el(
            "div",
            { class: "row" },
            el("div", { class: "name" }, p.name),
            track,
            el(
              "div",
              {
                class:
                  "value " + (isZero ? "tertiary" : isPositive ? "gain-text" : "loss-text"),
              },
              fmtSigned(p.net)
            )
          );
        });

        const axisRow = el(
          "div",
          { class: "axis-row" },
          el("div"),
          el(
            "div",
            { class: "axis-labels" },
            el("span", {}, `-$${maxAbs}`),
            el("span", {}, `+$${maxAbs}`)
          ),
          el("div")
        );

        return el(
          "section",
          { class: "stack stack-12" },
          el("h2", {}, "Net P/L by Player"),
          el(
            "div",
            { class: "chart stack stack-4" },
            headerRow,
            el("div", { class: "stack stack-4" }, ...rows),
            axisRow
          )
        );
      }

      function table() {
        const head = el(
          "thead",
          {},
          el(
            "tr",
            {},
            ...["#", "Player", "GP", "Buy-In", "Cash Out", "Net", "Net / Game"].map(
              (h) => el("th", {}, h)
            )
          )
        );
        const body = el(
          "tbody",
          {},
          ...sorted.map((p, i) =>
            el(
              "tr",
              { class: p.net > 0 ? "gain" : p.net < 0 ? "loss" : "" },
              el("td", {}, String(i + 1)),
              el("td", {}, p.name),
              el("td", {}, String(p.games)),
              el("td", {}, "$" + p.buyIn),
              el("td", {}, "$" + p.cashOut),
              el("td", {}, fmtSigned(p.net)),
              el("td", {}, fmtAvg(p.netAvg))
            )
          )
        );
        return el(
          "section",
          { class: "stack stack-12" },
          el("h2", {}, "Per-Session Performance"),
          el(
            "p",
            { class: "subtle small", style: "margin:0" },
            "Net per game reveals true skill independent of attendance — Swain leads at +$78/game (only 3 sessions), while Randell is the deepest hole at -$45/game."
          ),
          el("table", {}, head, body)
        );
      }

      const root = document.getElementById("root");
      root.appendChild(header());
      root.appendChild(stats());
      root.appendChild(el("hr", { class: "divider" }));
      root.appendChild(chart());
      root.appendChild(el("hr", { class: "divider" }));
      root.appendChild(table());
    </script>
  </body>
</html>
